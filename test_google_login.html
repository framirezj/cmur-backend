<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Test Google Login – CESFAM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f14;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e1e1e8;
    }

    .card {
      background: #1a1a24;
      border: 1px solid #2e2e42;
      border-radius: 16px;
      padding: 36px;
      width: 560px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #6b6b8a;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 0.78rem;
      color: #8888aa;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      background: #12121a;
      border: 1px solid #2e2e42;
      border-radius: 8px;
      color: #e1e1e8;
      font-size: 0.88rem;
      margin-bottom: 20px;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: #5b5bff; }

    .step {
      background: #12121a;
      border: 1px solid #2e2e42;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .step-title {
      font-size: 0.8rem;
      color: #5b5bff;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 14px;
    }

    /* Google button container */
    #g_btn { margin-bottom: 4px; }

    button.action-btn {
      width: 100%;
      padding: 11px;
      background: #5b5bff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, transform .1s;
      margin-top: 10px;
    }
    button.action-btn:hover { background: #7070ff; }
    button.action-btn:active { transform: scale(.98); }
    button.action-btn:disabled { background: #3a3a5a; cursor: not-allowed; }

    pre {
      background: #0c0c12;
      border: 1px solid #2e2e42;
      border-radius: 8px;
      padding: 14px;
      font-size: 0.78rem;
      color: #a0ffb0;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 260px;
      overflow-y: auto;
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      margin-right: 6px;
    }
    .tag-ok  { background: #1a3a1a; color: #60d060; }
    .tag-err { background: #3a1a1a; color: #d06060; }
    .tag-wait{ background: #1a1a3a; color: #6060d0; }

    .hint {
      font-size: 0.78rem;
      color: #5a5a7a;
      margin-top: 6px;
    }

    .token-box {
      word-break: break-all;
      font-size: 0.7rem;
      color: #80c8ff;
      background: #0c0c12;
      border: 1px dashed #2e2e42;
      border-radius: 6px;
      padding: 10px;
      margin-top: 10px;
      display: none;
    }

    .copy-btn {
      font-size: 0.75rem;
      background: #2e2e42;
      color: #a0a0c0;
      border: none;
      border-radius: 5px;
      padding: 4px 10px;
      cursor: pointer;
      margin-top: 8px;
      transition: background .2s;
    }
    .copy-btn:hover { background: #3e3e58; }
  </style>
</head>
<body>
<div class="card">
  <h1>🔐 Test – Google Login</h1>
  <p class="subtitle">Herramienta local para probar <code>POST /auth/google</code></p>

  <!-- PASO 0: config -->
  <div class="step">
    <div class="step-title">⚙️ Configuración</div>
    <label>Google Client ID</label>
    <input id="clientId" type="text" placeholder="1234567890-xxxx.apps.googleusercontent.com" />
    <label>URL del backend</label>
    <input id="backendUrl" type="text" value="http://localhost:8000" />
  </div>

  <!-- PASO 1: login con Google -->
  <div class="step">
    <div class="step-title">① Obtener id_token de Google</div>
    <div id="g_btn"></div>
    <p class="hint">Haz click en el botón de Google. El id_token aparecerá abajo.</p>
    <div class="token-box" id="tokenBox"></div>
    <button class="copy-btn" id="copyTokenBtn" onclick="copyToken()" style="display:none">📋 Copiar id_token</button>
  </div>

  <!-- PASO 2: llamar al backend -->
  <div class="step">
    <div class="step-title">② Llamar a POST /auth/google</div>
    <button class="action-btn" id="loginBtn" onclick="loginBackend()" disabled>
      Enviar id_token al backend
    </button>
    <pre id="response" style="margin-top:14px; display:none"></pre>
  </div>

  <!-- PASO 3: probar endpoint protegido -->
  <div class="step">
    <div class="step-title">③ Probar GET /usuarios/me (requiere JWT)</div>
    <button class="action-btn" id="meBtn" onclick="getMe()" disabled>
      GET /usuarios/me
    </button>
    <pre id="meResponse" style="margin-top:14px; display:none"></pre>
  </div>
</div>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  let idToken = null;
  let accessToken = null;

  // Inicializar Google cuando el script cargue
  window.addEventListener('load', () => {
    const clientId = document.getElementById('clientId').value.trim();
    if (clientId) initGoogle(clientId);
  });

  document.getElementById('clientId').addEventListener('change', () => {
    initGoogle(document.getElementById('clientId').value.trim());
  });

  function initGoogle(clientId) {
    if (!clientId || !window.google) {
      setTimeout(() => initGoogle(clientId), 500);
      return;
    }
    google.accounts.id.initialize({
      client_id: clientId,
      callback: handleGoogleResponse,
      auto_select: false,
    });
    google.accounts.id.renderButton(
      document.getElementById('g_btn'),
      { theme: 'filled_black', size: 'large', text: 'signin_with', shape: 'rectangular', width: 490 }
    );
  }

  function handleGoogleResponse(response) {
    idToken = response.credential;

    const box = document.getElementById('tokenBox');
    box.style.display = 'block';
    box.textContent = idToken;

    document.getElementById('copyTokenBtn').style.display = 'inline-block';
    document.getElementById('loginBtn').disabled = false;
  }

  function copyToken() {
    navigator.clipboard.writeText(idToken).then(() => {
      document.getElementById('copyTokenBtn').textContent = '✅ Copiado!';
      setTimeout(() => document.getElementById('copyTokenBtn').textContent = '📋 Copiar id_token', 2000);
    });
  }

  async function loginBackend() {
    const url = document.getElementById('backendUrl').value.trim();
    const respEl = document.getElementById('response');
    respEl.style.display = 'block';
    respEl.textContent = '⏳ Enviando...';

    try {
      const res = await fetch(`${url}/auth/google`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id_token: idToken }),
      });
      const data = await res.json();
      respEl.textContent = JSON.stringify(data, null, 2);

      if (res.ok && data.access_token) {
        accessToken = data.access_token;
        document.getElementById('meBtn').disabled = false;
        respEl.textContent = '✅ Login exitoso!\n\n' + JSON.stringify(data, null, 2);
      } else {
        respEl.style.color = '#ff8080';
        respEl.textContent = '❌ Error ' + res.status + '\n\n' + JSON.stringify(data, null, 2);
      }
    } catch (e) {
      respEl.style.color = '#ff8080';
      respEl.textContent = '❌ Error de red: ' + e.message;
    }
  }

  async function getMe() {
    const url = document.getElementById('backendUrl').value.trim();
    const meEl = document.getElementById('meResponse');
    meEl.style.display = 'block';
    meEl.textContent = '⏳ Cargando...';
    meEl.style.color = '#a0ffb0';

    try {
      const res = await fetch(`${url}/usuarios/me`, {
        headers: { 'Authorization': `Bearer ${accessToken}` },
      });
      const data = await res.json();
      meEl.textContent = (res.ok ? '✅ ' : '❌ ') + JSON.stringify(data, null, 2);
      if (!res.ok) meEl.style.color = '#ff8080';
    } catch (e) {
      meEl.style.color = '#ff8080';
      meEl.textContent = '❌ Error de red: ' + e.message;
    }
  }
</script>
</body>
</html>
